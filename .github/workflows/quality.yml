name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  style:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: vendor/bin/pint --test

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: vendor/bin/phpstan analyse --no-progress
